# Dependabot 설정
# 자세한 옵션: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 패키지 업데이트. 락파일이 bun.lock이므로 'npm'이 아닌 'bun' 에코시스템을 써야
  # package.json과 bun.lock이 함께 갱신됩니다. 'npm'으로 두면 package.json만 바뀌어
  # CI의 `bun install --frozen-lockfile`이 "lockfile had changes" 로 실패합니다.
  # (bun 에코시스템은 security update를 지원하지 않으므로, 보안 PR이 npm 경로로 열려
  #  bun.lock 없이 오면 로컬에서 `bun install` 후 bun.lock을 그 브랜치에 푸시합니다.)
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    # PR 관련 설정
    open-pull-requests-limit: 10
    target-branch: 'main'
    # 커밋 메시지 설정
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    # 리뷰어 자동 할당 (선택사항)
    # reviewers:
    #   - "dev_young_uk"
    # 라벨 자동 추가
    labels:
      - 'dependencies'
      - 'automated'
    # 업데이트 그룹핑 (관련 패키지들을 하나의 PR로 묶기)
    groups:
      # React 관련 패키지들
      react-ecosystem:
        patterns:
          - 'react*'
          - '@types/react*'
          - 'next*'
      # Testing 관련 패키지들
      testing:
        patterns:
          - '*jest*'
          - '*vitest*'
          - '@testing-library/*'
          - 'storybook*'
          - '@storybook/*'
      # Build tools
      build-tools:
        patterns:
          - 'typescript'
          - 'eslint*'
          - 'prettier*'
          - 'postcss*'
          - 'tailwindcss*'
          - 'bun*'
      # Development dependencies
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'

  # GitHub Actions 워크플로우 업데이트
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'
